name: Build Toolchain

on:
  workflow_dispatch:
  # Any branch push that touches these files builds that exact commit.
  push:
    branches: ["**"]
    paths:
      - "build.sh"
      - "toolconf"
      - ".github/workflows/toolchain.yml"
    # Path filters are not applied to tag pushes; v* tags always build
    # and are the only trigger that creates a release (last step).
    tags: ["v*"]

# A newer push to the same ref cancels the older, still-running build.
concurrency:
  group: toolchain-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: write

jobs:
  build:
    name: Build cross toolchain
    runs-on: ubuntu-24.04
    timeout-minutes: 180

    steps:
      - name: Checkout toolchain repository
        uses: actions/checkout@v4

      - name: Restore source tarball cache
        id: src-cache
        uses: actions/cache/restore@v4
        with:
          path: ~/src
          key: src-${{ runner.os }}-${{ hashFiles('toolconf') }}
          restore-keys: |
            src-${{ runner.os }}-

      - name: Build toolchain
        run: bash ./build.sh

      # Save even if the build failed, so downloads aren't repeated.
      - name: Save source tarball cache
        if: always() && steps.src-cache.outputs.cache-hit != 'true'
        uses: actions/cache/save@v4
        with:
          path: ~/src
          key: src-${{ runner.os }}-${{ hashFiles('toolconf') }}

      - name: Convert hardlinks to symlinks
        run: |
          python3 - <<'PY'
          import os
          seen = {}
          for d, _, files in os.walk("uptoolchain"):
              for f in sorted(files):
                  p = os.path.join(d, f)
                  if os.path.islink(p):
                      continue
                  st = os.lstat(p)
                  if st.st_nlink < 2:
                      continue
                  key = (st.st_dev, st.st_ino)
                  if key not in seen:
                      seen[key] = p
                      continue
                  os.remove(p)
                  os.symlink(os.path.relpath(seen[key], d), p)
          PY

      - name: Upload build logs on failure
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: build-logs
          path: |
            work/build/build.log*
            work/crosstool-ng-*/config.log
          if-no-files-found: ignore
          retention-days: 14

      - name: Upload toolchain artifact
        uses: actions/upload-artifact@v4
        with:
          name: uptoolchain
          path: uptoolchain/
          if-no-files-found: error
          retention-days: 14

      - name: Attach to release
        if: startsWith(github.ref, 'refs/tags/')
        uses: softprops/action-gh-release@v2
        with:
          files: uptoolchain/*
