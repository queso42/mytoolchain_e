name: Build Toolchain

on:
  workflow_dispatch:
  # Any branch push that touches these files builds that exact commit.
  push:
    branches: ["**"]
    paths:
      - "build.sh"
      - "toolconf"
      - ".github/workflows/toolchain.yml"

# A newer push to the same ref cancels the older, still-running build.
concurrency:
  group: toolchain-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  build:
    name: Build cross toolchain
    runs-on: ubuntu-24.04-arm
    timeout-minutes: 180

    steps:
      - name: Checkout toolchain repository
        uses: actions/checkout@v4

      - name: Restore source tarball cache
        id: src-cache
        uses: actions/cache/restore@v4
        with:
          path: ~/src
          key: src-${{ runner.os }}-${{ hashFiles('toolconf') }}
          restore-keys: |
            src-${{ runner.os }}-

      - name: Build toolchain
        run: bash ./build.sh

      # Only save after a successful build: caches are immutable per key, so
      # saving a half-downloaded ~/src from a failed run would poison this
      # key until toolconf changes.
      - name: Save source tarball cache
        if: success() && steps.src-cache.outputs.cache-hit != 'true'
        uses: actions/cache/save@v4
        with:
          path: ~/src
          key: src-${{ runner.os }}-${{ hashFiles('toolconf') }}

      - name: Convert hardlinks to symlinks
        run: |
          python3 - <<'PY'
          import os
          seen = {}
          for d, dirs, files in os.walk("uptoolchain"):
              dirs.sort()  # deterministic choice of the "primary" file
              for f in sorted(files):
                  p = os.path.join(d, f)
                  if os.path.islink(p):
                      continue
                  st = os.lstat(p)
                  if st.st_nlink < 2:
                      continue
                  key = (st.st_dev, st.st_ino)
                  if key not in seen:
                      seen[key] = p
                      continue
                  os.remove(p)
                  os.symlink(os.path.relpath(seen[key], d), p)
          PY

      # upload-artifact drops permissions and follows symlinks, which would
      # undo the step above and strip exec bits. A tarball keeps both.
      - name: Package toolchain
        run: |
          name="uptoolchain-${GITHUB_REF_NAME//\//-}"
          mkdir -p dist
          tar -C uptoolchain -cf - . | xz -T0 -6 > "dist/${name}.tar.xz"
          (cd dist && sha256sum "${name}.tar.xz" > "${name}.tar.xz.sha256")
          ls -lh dist

      - name: Upload build logs on failure
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: build-logs
          path: |
            work/build/build.log*
            work/crosstool-ng-*/config.log
          if-no-files-found: ignore
          retention-days: 5

      - name: Upload toolchain artifact
        uses: actions/upload-artifact@v4
        with:
          name: uptoolchain
          path: dist/
          compression-level: 0   # already xz-compressed
          if-no-files-found: error
          retention-days: 5
