name: Build Toolchain

on:
  workflow_dispatch:
  # Any branch push that touches these files builds that exact commit.
  push:
    branches: ["**"]
    paths:
      - "build.sh"
      - "toolconf"
      - "tar_hard2sym.py"
      - ".github/workflows/toolchain.yml"

# A newer push to the same ref cancels the older, still-running build.
concurrency:
  group: toolchain-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  build:
    name: Build cross toolchain
    runs-on: ubuntu-24.04-arm
    timeout-minutes: 180

    steps:
      - name: Checkout toolchain repository
        uses: actions/checkout@v4

      - name: Restore source tarball cache
        id: src-cache
        uses: actions/cache/restore@v4
        with:
          path: ~/src
          key: src-${{ runner.os }}-${{ hashFiles('toolconf') }}
          restore-keys: |
            src-${{ runner.os }}-

      - name: Build toolchain
        run: bash ./build.sh

      # Only save after a successful build: caches are immutable per key, so
      # saving a half-downloaded ~/src from a failed run would poison this
      # key until toolconf changes.
      - name: Save source tarball cache
        if: success() && steps.src-cache.outputs.cache-hit != 'true'
        uses: actions/cache/save@v4
        with:
          path: ~/src
          key: src-${{ runner.os }}-${{ hashFiles('toolconf') }}

      # upload-artifact drops permissions and follows symlinks, so ship a
      # tarball. tar_hard2sym.py rewrites hardlink entries as relative
      # symlinks while streaming, and writes the only archive in dist/.
      - name: Package toolchain
        run: |
          name="uptoolchain-${GITHUB_REF_NAME//\//-}"
          mkdir -p dist
          tar -C uptoolchain -cf "$RUNNER_TEMP/raw.tar" .
          python3 tar_hard2sym.py "$RUNNER_TEMP/raw.tar" "dist/${name}.tar.xz"
          rm -f "$RUNNER_TEMP/raw.tar"
          (cd dist && sha256sum "${name}.tar.xz" > "${name}.tar.xz.sha256")
          ls -lh dist

      - name: Upload build logs on failure
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: build-logs
          path: |
            work/build/build.log*
            work/crosstool-ng-*/config.log
          if-no-files-found: ignore
          retention-days: 5

      - name: Upload toolchain artifact
        uses: actions/upload-artifact@v4
        with:
          name: uptoolchain
          path: dist/
          compression-level: 0   # already xz-compressed
          if-no-files-found: error
          retention-days: 5
